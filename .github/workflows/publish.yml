# NOT RUN yet. Publishes to npm when you create a GitHub Release.
# Needs a repository secret named NPM_TOKEN (an npm "Automation" token).
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # lets npm record build provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
