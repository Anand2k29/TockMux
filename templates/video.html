<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSS + JS promo</title>
<!-- TockMux reads these. Everything is optional except it helps to declare the duration. -->
<meta name="html2mp4:duration" content="6">
<meta name="html2mp4:width" content="1280">
<meta name="html2mp4:height" content="720">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f1030; font-family: "Segoe UI", system-ui, Arial, sans-serif; color: #f6f4ff; }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(90% 80% at 20% 0%, #2a1c6e, #0f1030 65%); }
  h1 { font-size: 84px; letter-spacing: -2px; opacity: 0; transform: translateY(40px); animation: rise 1s cubic-bezier(.2,.8,.2,1) .3s forwards; }
  h1 span { background: linear-gradient(100deg, #8b6bff, #ff6b9a); -webkit-background-clip: text; color: transparent; }
  p { margin-top: 18px; font-size: 30px; color: #b9b4e6; opacity: 0; animation: fade 1s ease 1.2s forwards; }
  .orb { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, #ff6b9a, transparent 68%); opacity: .35; filter: blur(8px); }
  #count { position: absolute; bottom: 70px; font-size: 40px; font-weight: 700; color: #ffc857; font-variant-numeric: tabular-nums; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
  <div class="orb" id="orb"></div>
  <div style="text-align:center; position:relative">
    <h1>Animation in, <span>MP4 out</span></h1>
    <p>CSS keyframes and JavaScript, drawn frame by frame.</p>
  </div>
  <div id="count">0 frames drawn</div>
</div>
<script>
  // Plain requestAnimationFrame code. TockMux's virtual clock drives it, no special API needed.
  const orb = document.getElementById("orb");
  const count = document.getElementById("count");
  let n = 0;
  function tick(ts) {
    const t = ts / 1000;
    orb.style.transform = "translate(" + Math.cos(t * 1.3) * 380 + "px," + Math.sin(t * 1.7) * 150 + "px) scale(" + (1 + Math.sin(t * 2) * 0.15) + ")";
    count.textContent = ++n + " frames drawn";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
