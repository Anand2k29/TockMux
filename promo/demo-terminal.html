<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TockMux terminal demo</title>
<meta name="html2mp4:duration" content="14">
<meta name="html2mp4:width" content="1280">
<meta name="html2mp4:height" content="720">
<style>
  :root { --paper:#F4EFE3; --ink:#161514; --mustard:#E3B95C; --rose:#E59A8A; --sage:#A9C5A0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--paper); font-family: Arial, sans-serif; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 52px; background: var(--ink); display: flex; align-items: center; gap: 10px; padding: 0 22px; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--paper); display: inline-block; }
  .bar span { color: var(--paper); font: 700 16px "Courier New", monospace; margin-left: 16px; opacity: .7; }
  .term { position: absolute; left: 60px; top: 90px; width: 1160px; height: 560px; background: var(--ink); border: 4px solid var(--ink); box-shadow: 14px 14px 0 var(--mustard); padding: 30px 34px; font: 26px/1.6 "Courier New", Consolas, monospace; color: var(--paper); white-space: pre; overflow: hidden; }
  .p { color: var(--mustard); }
  .ok { color: var(--sage); }
  .dim { color: #9C9890; }
  .hot { color: var(--rose); }
  .caret { display: inline-block; width: 14px; height: 26px; background: var(--mustard); vertical-align: -4px; }
  .line { opacity: 0; }
  .label { position: absolute; left: 60px; bottom: 26px; font: 700 20px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
</style>
</head>
<body>
<div class="bar"><i></i><i></i><i></i><span>terminal · your project</span></div>
<div class="term" id="term">
<span class="p">$</span> <span id="cmd1"></span><span class="caret" id="c1"></span>
<span class="line" id="l1"><span class="ok">+</span> Read promo.html   1920x1080  30 fps  12 s</span>
<span class="line" id="l2"><span class="ok">+</span> Rendering  <span class="p" id="bar">████████████████████████████████░░░░░░░░</span>  80%</span>
<span class="line" id="l3"><span class="ok">+</span> Video ready   <span class="ok">promo.mp4</span>  <span class="dim">rendered in 21s</span></span>
<span class="p line" id="l4" style="margin-top:14px">$</span> <span class="line" id="l4b"><span id="cmd2"></span></span>
<span class="line" id="l5"><span class="ok">+</span> Watching promo.html   <span class="dim">save the file to render</span></span>
<span class="line" id="l6"><span class="ok">+</span> Render #2 finished in 9s</span>
</div>
<div class="label" id="label">Terminal · one command, one video</div>
<script>
  // Timeline engine, deterministic: everything depends on page time t.
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const C1 = "tockmux render promo.html";
  const C2 = "tockmux watch promo.html";
  let t0 = null;
  function frame(t) {
    const n1 = Math.floor(clamp((t - 0.6) / 2.8) * C1.length);
    $("cmd1").textContent = C1.slice(0, n1);
    $("c1").style.opacity = t < 3.6 ? 1 : 0;
    const show = (id, at) => { $(id).style.opacity = t >= at ? 1 : 0; };
    show("l1", 3.8); show("l2", 4.6); show("l3", 8.2);
    $("bar").style.opacity = t >= 4.6 ? 1 : 0;
    const n2 = Math.floor(clamp((t - 9.0) / 2.2) * C2.length);
    $("cmd2").textContent = C2.slice(0, n2);
    show("l4", 9.0); show("l4b", 9.0);
    show("l5", 11.4); show("l6", 12.6);
  }
  function loop(now) { if (t0 === null) t0 = now; frame((now - t0) / 1000); requestAnimationFrame(loop); }
  frame(0);
  requestAnimationFrame(loop);
</script>
</body>
</html>
