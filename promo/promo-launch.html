<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TockMux launch film</title>
<meta name="html2mp4:duration" content="30">
<meta name="html2mp4:width" content="1920">
<meta name="html2mp4:height" content="1080">
<style>
  :root { --paper:#F4EFE3; --ink:#161514; --mustard:#E3B95C; --rose:#E59A8A; --sage:#A9C5A0; --slate:#9DB2CC; --lilac:#C9BEDD; --white:#FFFDF7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }
  .display { font-family: "Arial Black", Arial, sans-serif; text-transform: uppercase; letter-spacing: -3px; word-spacing: -14px; line-height: 1; white-space: nowrap; }
  .letters span { display: inline-block; opacity: 0; }
  .tag { position: absolute; left: 160px; top: 150px; border: 6px solid var(--ink); background: var(--white); box-shadow: 10px 10px 0 var(--ink); padding: 12px 26px; font-size: 34px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
  .card { position: absolute; border: 6px solid var(--ink); background: var(--white); box-shadow: 16px 16px 0 var(--ink); }
  .mono { font-family: "Courier New", Consolas, monospace; font-weight: 700; }
  .wipe { position: absolute; inset: 0; background: var(--ink); transform: translateX(-100%); }
  .dot { width: 26px; height: 26px; border: 4px solid var(--paper); border-radius: 50%; }
  .frame-counter { position: absolute; right: 160px; bottom: 120px; font-size: 44px; font-weight: 800; border: 6px solid var(--ink); background: var(--white); box-shadow: 10px 10px 0 var(--ink); padding: 10px 22px; }
</style>
</head>
<body>
<div id="stage">

  <!-- Scene 1 (0 to 4.2 s): a square and the first words -->
  <div class="scene" id="s1" style="background: var(--paper)">
    <div class="abs" id="sq1" style="left: 1180px; top: 260px; width: 340px; height: 340px; background: var(--mustard); border: 8px solid var(--ink); box-shadow: 18px 18px 0 var(--ink);"></div>
    <div class="abs display letters" id="l1" style="left: 160px; top: 330px; font-size: 150px;"></div>
    <div class="abs display letters" id="l1b" style="left: 160px; top: 520px; font-size: 150px;"></div>
  </div>

  <!-- Scene 2 (4.2 to 8.6 s): the screen recorder stutters -->
  <div class="scene" id="s2" style="background: var(--slate)">
    <div class="tag">Screen recording</div>
    <div class="abs" id="jit" style="left: 160px; top: 380px; width: 320px; height: 320px; background: var(--rose); border: 8px solid var(--ink); box-shadow: 18px 18px 0 var(--ink);"></div>
    <div class="abs display letters" id="l2" style="left: 640px; top: 380px; font-size: 130px;"></div>
    <div class="abs display letters" id="l2b" style="left: 640px; top: 560px; font-size: 130px;"></div>
    <div class="abs mono" id="sub2" style="left: 640px; top: 760px; font-size: 40px; opacity: 0;">Stutters when the computer is busy.</div>
  </div>

  <!-- Scene 3 (8.6 to 13.6 s): the clock -->
  <div class="scene" id="s3" style="background: var(--paper)">
    <div class="tag">TockMux</div>
    <svg class="abs" id="dial" style="left: 1180px; top: 220px; width: 520px; height: 520px;" viewBox="0 0 520 520">
      <circle cx="260" cy="260" r="240" fill="#FFFDF7" stroke="#161514" stroke-width="14"/>
      <circle cx="260" cy="260" r="190" fill="none" stroke="#161514" stroke-width="6" stroke-dasharray="6 18"/>
      <path id="arc" d="" fill="none" stroke="#E3B95C" stroke-width="40"/>
      <line id="hand" x1="260" y1="260" x2="260" y2="90" stroke="#161514" stroke-width="16" stroke-linecap="square"/>
      <circle cx="260" cy="260" r="20" fill="#161514"/>
    </svg>
    <div class="abs display letters" id="l3" style="left: 160px; top: 380px; font-size: 128px;"></div>
    <div class="abs display letters" id="l3b" style="left: 160px; top: 560px; font-size: 128px;"></div>
    <div class="abs mono" id="sub3" style="left: 160px; top: 800px; font-size: 40px; opacity: 0;">One frame at a time. The same video on every run.</div>
    <div class="frame-counter mono" id="fc">FRAME 000</div>
  </div>

  <!-- Scene 4 (13.6 to 19.6 s): the terminal -->
  <div class="scene" id="s4" style="background: var(--sage)">
    <div class="card" id="term" style="left: 160px; top: 200px; width: 1600px; height: 600px; background: var(--ink); opacity: 0;">
      <div style="height: 64px; border-bottom: 4px solid var(--paper); display: flex; align-items: center; gap: 14px; padding: 0 26px;">
        <div class="dot" style="background: var(--rose);"></div>
        <div class="dot" style="background: var(--mustard);"></div>
        <div class="dot" style="background: var(--sage);"></div>
      </div>
      <div class="mono" id="cmd" style="position: absolute; left: 60px; top: 110px; font-size: 54px; color: var(--paper); white-space: pre;"></div>
      <div class="mono" id="out1" style="position: absolute; left: 60px; top: 230px; font-size: 40px; color: var(--sage); opacity: 0;">+ Read promo.html  ·  1920x1080  ·  30 fps</div>
      <div id="bar" style="position: absolute; left: 60px; top: 320px; width: 1480px; height: 60px; border: 4px solid var(--paper);">
        <div id="barfill" style="height: 100%; width: 0; background: var(--mustard);"></div>
      </div>
      <div class="mono" id="out2" style="position: absolute; left: 60px; top: 430px; font-size: 40px; color: var(--paper); opacity: 0;">+ Video ready: promo.mp4</div>
    </div>
  </div>

  <!-- Scene 5 (19.6 to 25.6 s): formats and the save loop -->
  <div class="scene" id="s5" style="background: var(--lilac)">
    <div class="card" id="f1" style="left: 160px; top: 230px; width: 440px; height: 360px; background: var(--mustard); display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', Arial, sans-serif; font-size: 96px; opacity: 0;">MP4</div>
    <div class="card" id="f2" style="left: 740px; top: 230px; width: 440px; height: 360px; background: var(--white); display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', Arial, sans-serif; font-size: 96px; opacity: 0;">GIF</div>
    <div class="card" id="f3" style="left: 1320px; top: 230px; width: 440px; height: 360px; background: var(--rose); display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', Arial, sans-serif; font-size: 96px; opacity: 0;">WEBM</div>
    <div class="abs display" id="loop" style="left: 160px; top: 760px; font-size: 110px; opacity: 0;">SAVE. RENDER. REPEAT.</div>
  </div>

  <!-- Scene 6 (25.6 to 31 s): the logo and the install line -->
  <div class="scene" id="s6" style="background: var(--ink); color: var(--paper)">
    <div class="abs" id="logo" style="left: 160px; top: 230px; width: 240px; height: 240px; background: var(--mustard); border: 10px solid var(--paper); box-shadow: 16px 16px 0 var(--rose);"></div>
    <div class="abs display letters" id="l6" style="left: 440px; top: 200px; font-size: 210px; color: var(--paper);"></div>
    <div class="abs mono" id="tag6" style="left: 160px; top: 560px; font-size: 56px; opacity: 0; color: var(--paper);">Your HTML animation, as a real MP4.</div>
    <div class="card mono" id="inst" style="left: 160px; top: 700px; width: 1200px; height: 140px; background: var(--white); color: var(--ink); font-size: 60px; padding: 30px 44px; opacity: 0; box-shadow: 16px 16px 0 var(--rose);"></div>
  </div>

  <div class="wipe" id="wipe"></div>
</div>

<script>
  // Timeline engine: every value is a function of page time t (seconds).
  // TockMux advances requestAnimationFrame one frame at a time, so the film is identical on every render.
  const $ = (id) => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  // split text into spans so each letter can rise and fade on its own
  function splitLetters(id, text) {
    const el = $(id);
    el.innerHTML = [...text].map((ch) => "<span>" + (ch === " " ? "&nbsp;" : ch) + "</span>").join("");
    return [...el.querySelectorAll("span")];
  }
  const L = {
    l1: splitLetters("l1", "Your animation"),
    l1b: splitLetters("l1b", "is a web page."),
    l2: splitLetters("l2", "Different"),
    l2b: splitLetters("l2b", "every time."),
    l3: splitLetters("l3", "It takes"),
    l3b: splitLetters("l3b", "the clock."),
    l6: splitLetters("l6", "TockMux")
  };
  const CMD = "tockmux render promo.html";
  const INSTALL = "npm install -g tockmux";

  // letters pop in one after another between t0 and t1
  function letters(spans, t, t0, t1) {
    const step = (t1 - t0) / spans.length;
    spans.forEach((s, i) => {
      const p = easeOut(seg(t, t0 + i * step, t0 + i * step + 0.35));
      s.style.opacity = p;
      s.style.transform = "translateY(" + ((1 - p) * 40) + "px)";
    });
  }
  // fade in at a, fade out at b (b = 99 means stay)
  function fade(el, t, a, b, len = 0.4) {
    const inP = easeOut(seg(t, a, a + len));
    const outP = t > b ? 1 - seg(t, b, b + len) : 1;
    el.style.opacity = Math.min(inP, outP);
  }
  function sceneOn(id, t, a, b) {
    $(id).style.opacity = t >= a && t < b ? 1 : 0;
  }

  // wipes: an ink panel crosses the screen between scenes
  const WIPES = [[3.8, 4.6], [8.2, 9.0], [13.2, 14.0], [19.2, 20.0], [25.2, 26.0]];
  function wipe(t) {
    let x = -100;
    for (const [a, b] of WIPES) {
      if (t >= a && t < b) {
        const p = seg(t, a, b);
        x = p < 0.5 ? -100 + easeInOut(p * 2) * 100 : easeInOut((p - 0.5) * 2) * -100;
      }
    }
    $("wipe").style.transform = "translateX(" + x + "%)";
  }

  function render(t) {
    sceneOn("s1", t, 0, 4.2);
    sceneOn("s2", t, 4.2, 8.6);
    sceneOn("s3", t, 8.6, 13.6);
    sceneOn("s4", t, 13.6, 19.6);
    sceneOn("s5", t, 19.6, 25.6);
    sceneOn("s6", t, 25.6, 31);

    // scene 1: the square spins in, words rise
    const spin = easeOut(seg(t, 0, 1.2));
    $("sq1").style.transform = "rotate(" + ((1 - spin) * -180) + "deg) scale(" + spin + ")";
    letters(L.l1, t, 0.4, 1.8);
    letters(L.l1b, t, 1.6, 2.8);

    // scene 2: a jittery square (a stutter), then it settles smooth
    const jit = $("jit");
    if (t < 6.2) {
      const step = Math.floor(t * 14) % 4;
      const dx = [0, -26, 18, -8][step];
      const dy = [0, 12, -16, 6][step];
      jit.style.transform = "translate(" + dx + "px, " + dy + "px)";
    } else {
      const s = easeOut(seg(t, 6.2, 6.8));
      jit.style.transform = "scale(" + (1 + Math.sin(s * Math.PI) * 0.06) + ")";
    }
    letters(L.l2, t, 4.8, 5.8);
    letters(L.l2b, t, 5.6, 6.8);
    fade($("sub2"), t, 6.6, 99);

    // scene 3: the dial fills and the hand sweeps; a frame counter ticks
    const pct = clamp((t - 8.8) / 4);
    const a = pct * 2 * Math.PI - Math.PI / 2;
    const r = 210;
    const x = 260 + r * Math.cos(a);
    const y = 260 + r * Math.sin(a);
    const large = pct > 0.5 ? 1 : 0;
    $("arc").setAttribute("d", pct <= 0 ? "" : "M 260 " + (260 - r) + " A " + r + " " + r + " 0 " + large + " 1 " + x.toFixed(2) + " " + y.toFixed(2));
    $("hand").setAttribute("transform", "rotate(" + (((t - 8.6) * 120) % 360) + " 260 260)");
    letters(L.l3, t, 8.9, 9.8);
    letters(L.l3b, t, 9.4, 10.6);
    fade($("sub3"), t, 11, 99);
    $("fc").textContent = "FRAME " + String(Math.max(0, Math.floor(t * 30) - 258)).padStart(3, "0");
    $("fc").style.opacity = easeOut(seg(t, 8.8, 9.2));

    // scene 4: the terminal opens, the command types, the bar fills
    const pop = easeOut(seg(t, 13.8, 14.3));
    $("term").style.opacity = pop;
    $("term").style.transform = "scale(" + (0.9 + 0.1 * pop) + ")";
    const typed = Math.floor(clamp((t - 14.4) / 2.2) * CMD.length);
    $("cmd").textContent = "$ " + CMD.slice(0, typed) + (t < 16.8 ? "_" : "");
    fade($("out1"), t, 16.8, 99, 0.3);
    $("barfill").style.width = (clamp((t - 17.2) / 1.6) * 100).toFixed(2) + "%";
    fade($("out2"), t, 18.9, 99, 0.3);

    // scene 5: three format cards drop in, then the save loop line
    [["f1", 19.8], ["f2", 20.2], ["f3", 20.6]].forEach(([id, at]) => {
      const p = easeOut(seg(t, at, at + 0.5));
      $(id).style.opacity = p;
      $(id).style.transform = "translateY(" + ((1 - p) * 120) + "px) rotate(" + ((1 - p) * -6) + "deg)";
    });
    fade($("loop"), t, 22.8, 99, 0.5);

    // scene 6: logo turns in, wordmark, tagline, install line types out
    const lg = easeOut(seg(t, 25.8, 26.4));
    $("logo").style.transform = "rotate(" + ((1 - lg) * 90) + "deg) scale(" + lg + ")";
    letters(L.l6, t, 26.2, 27.2);
    fade($("tag6"), t, 27.3, 99);
    $("inst").style.opacity = t >= 27.8 ? 1 : 0;
    const k = Math.floor(clamp((t - 28) / 1.2) * INSTALL.length);
    $("inst").textContent = "$ " + INSTALL.slice(0, k) + (t < 29.2 ? "_" : "");

    wipe(t);
  }

  let t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    render((now - t0) / 1000);
    requestAnimationFrame(loop);
  }
  render(0);
  requestAnimationFrame(loop);
</script>
</body>
</html>
